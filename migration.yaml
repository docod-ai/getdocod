# INTERNAL — the model's pending/resolved history. Dev-only: never installed,
# never part of a user's repo. A deleted blocker is a blocker that comes back.

# -----------------------------------------------------------------------------
migration:
  pending:
    - id: diagnostic-mode
      severity: major
      progress: |
        Machinery shipped in 1.6.0: /docod:diagnose (installer command),
        agent.yaml § diagnostic_mode, DIV-nn generalized to claim-vs-reality,
        RISK-nn as a first-class numbered finding, the `diagnostic` artifact
        (tech-lead.consolidate_diagnostic). 1.7.0 shipped the SELLABLE REPORT
        PROFILE: `report --diagnostic` renders a static dossier from the
        `report:` data contract (diagnostic-template.html), the census reads
        recorded-vs-ratified, and verify flags absolute-absence claims so the
        "no why" flatten cannot ship. Remaining is pure GO-TO-MARKET: the offer
        framing in README/landing (two-engine precondition,
        pre-read-not-pre-approved) and pricing — no machinery left.
      issue: |
        Market analysis from the field: greenfield sells prevention (hard),
        legacy sells diagnosis (the pain is on the table). The reverse already
        delivers the diagnosis — one pass produced 76 RFs and 18 DIVs, finding
        a silent production bug, exposed PII and one-click destructive actions
        in a repo the team considered healthy. What consumed the session was
        NOT the reverse: it was the method overhead after it (approvals, pins,
        cascades). The spearhead product is trapped inside the method.
      decision: |
        Name and package what already exists de facto: DIAGNOSTIC MODE —
        reverse_* + triangulation + DIV table, no approvals, no pins, no
        lineage, nothing frozen, no adoption required. "Point it at your repo;
        get the evidenced map and the numbered list of everywhere your docs
        lie." One command (/docod:diagnose or a documented flow), output is
        the report. The full method is the upsell for whoever the result
        scared. Cheap enough to demo, expensive enough to charge for.
      design_notes: |
        Settled across three analysis rounds (2026-07-29), each point checked
        against the record rather than the summary of it:

        VIABILITY IS ANSWERED, empirically. The Blue City pilot ran the
        reverse on a FOREIGN harness (Kimi K3 over AGENTS.md, no docod.mjs):
        3 reversed designs, 40 cross-corroborated DIVs, a privacy finding
        classified as RISK, stale detection of the legacy docs and of our
        own. The reverse survives without the method. What remains is
        packaging, not machinery.

        THE DECOMPOSITION that makes it separable: the method bundles three
        layers the diagnostic splits — provenance labels (writing
        discipline, zero cost, travels in the text), content hash (twenty
        mechanical lines), governance (approval, pin, cascade — the
        expensive part). The divergence object needs the first two and none
        of the third. In legacy, the frozen human side is the legacy doc
        ITSELF — vouched by existing, not by being approved. Diagnostic mode
        is snapshot lineage applied to EVERYTHING — a record of a moment,
        observed-at inputs, reported and never failed — a class the registry
        already has; no weakened method needed.

        TWO ENGINES, and the offer's precondition follows. (1) doc-vs-code:
        the DIV table; dries up without docs. (2) code-against-itself: parts
        that stopped agreeing, exposed PII, one-click destructive actions,
        silent production bugs — fires on a mute repo (the pilot's privacy
        RISK and the field report's production findings are this engine).
        The precondition of the offer is therefore NOT "you have docs you do
        not trust" — it is "your system is big enough that its parts have
        stopped agreeing". Writing it as needs-docs gives away the sickest
        segment (large, undocumented) for free.
        Object-model gap to close in packaging: DIV-nn is DEFINED as
        doc-vs-code (reverse_conventions), so the second engine's output —
        the pilot's "RISK" — exists only in prose today. The diagnostic
        report must carry it first-class (a numbered finding class beside
        the DIVs, with the same both-sides evidence bar) or the strongest
        engine ships unlabeled. Related honest nuance: cross-corroboration
        is defined as the strongest signal TRIANGULATION produces, so a
        cross-corroborated DIV normally still has a doc side — the
        code-only evidence for engine 2 is the RISK/finding class, not the
        DIV count.

        THE UPSELL, said honestly: a diagnostic deposits DATED observed-at
        hashes and provenance labels — the system is pre-READ, not
        pre-APPROVED. Nothing self-approves; a snapshot does not become a
        live baseline without a human vouching each artifact forward. The
        pitch is "we have read and dated your system; adopting the method is
        vouching that forward" — strong, and inside the product's own law.
        "The baseline is already pinned" overclaims and contradicts the law
        the product sells.

        ZERO-COST GOVERNANCE FLOOR — the line between a diagnosis and a
        consultancy PDF: the diagnostic is born with the external-questions
        queue populated and an owner per finding. Both shipped in 1.5.0,
        both costless, and they are the ONLY governance that rides along.

        Remaining work, exactly: /docod:diagnose (or the documented flow), a
        report output profile focused on DIVs + findings + provenance, and
        the two framings above written into the offer.

    - id: section-granularity
      severity: major
      issue: |
        Staleness hashes at FILE granularity, so the declared graph is
        coarser than the real one: an edit to one RF invalidates all 33 of
        the frd's consumers, though each consumer depends on a handful of
        RFs. Field week: the frd — the most-depended artifact — was edited 4
        times; 4 cascades, ~128 re-pins, near-zero intellectual content. The
        Stable Dependencies Principle is violated by the FILE (most depended,
        most edited) but respected by the RF (individually stable) — pinning
        per section IS depending toward stability.
      decision: |
        DESIGN FIRST (ADR-A grade), and MEASURE THE PREMIUM BEFORE the
        design — the "15 rule", named after the week's own unmeasured number:
        against the 4 real frd edits, count how many of the 33 consumers were
        pinned to an RF that actually changed. Concentrated edits (5/33) ⇒
        section pinning is gold; diffuse edits (25/33) ⇒ the convention +
        new drift class do not pay. Do not let the biggest idea enter the ADR
        the way auth entered bucket 2.
        The REAL cost is not boundary drift — it is FALSE GREEN: file hash
        over-invalidates (noisy, conservative, never misses); section hash
        under-invalidates (precise, can MISS — a shared definition above the
        block changes, the block's hash does not, the consumer goes silently
        stale). On a threat-model edge false green is worse than false red,
        in direct tension with house law (permissive fallbacks fail loud).
        Resolution direction, if the premium justifies: OPT-IN per edge,
        risk-weighted, with a coupling escape hatch (pin block + preamble
        hash, or declare the coupling) — presented as ONE coordinate system
        with edge lineage: each edge now has knobs (lineage: live/snapshot;
        granularity: file/section) and the RISK of the edge chooses both.
        Security edges default to conservative file-grain.

    - id: cascade-economy
      severity: major
      issue: |
        Field week: 5 real findings generated ~20 agent rounds. Each finding
        went straight to its owner agent, each owner edit re-opened the
        cascade — the api-contract opened 3× when the 2nd and 3rd rounds'
        items were already known in the 1st (BUG-02/04 in qa.md since
        31/07). With ONE human on every gate, cascades serialize: same
        intellectual cost as a team of ten, five times the clock. The
        structural frame that decides the solution: the single human is the
        AMPLIFIER (serialization), not the cause — the cause is the graph.
        "I am alone" leads to hiring; "the graph is expensive and I
        serialize" leads to fixing the graph and the tax, which is doable
        today.
      decision: |
        The wave reform (ADR-B grade), deferred until section-granularity's
        premium is MEASURED — fixing the mechanism first re-prices the
        workflow reform (converging on the workflow before measuring what
        the mechanism bought is the exact sin the field week exposed). Three
        open decisions, named so they do not dissolve:
        (1) WHERE THE QUEUE LIVES — findings accumulate in a registry
        (append-only precedent: external-questions/DIV), likely owned by
        impact-analysis, the propagation owner; artifacts open once per
        wave, not once per finding.
        (2) WHO FIRES THE WAVE — a named human act (a `ws wave`, analogous
        to approve). Anything automatic is an orchestrator in disguise.
        (3) HONEST RED IN THE WINDOW — while a re-pin waits for the wave,
        verify must distinguish "stale — QUEUED (wave N)" from "stale —
        nobody has seen this", by cross-referencing the queue; otherwise the
        reform manufactures the fourth always-red alarm.
        Doctrine already shipped (1.11.0, agent.yaml finding_urgency): the
        sorting question is "would it change what is about to be built?"
        (not "does it block execution?" — vague, left both field cases
        undecided); what is deferred is the RE-RUN, never the KNOWLEDGE; the
        batch target is not "fewer waves" (the waterfall limit) but wave
        boundaries aligned to real decision points.
        INTERACTS with graduated-gate: two halves of the same gate economy —
        that one cuts ceremony per item, this one cuts trips to the gate.
        Design them aware of each other or redo one.

    - id: coverage-invariants
      severity: major
      issue: |
        Field case (the auth hole, found at task 6 of dozens): system-design
        defined "COMP-07 — Identidade & Autorização"; task-extraction produced
        the component's NOUNS (user tables, enrollment, role mutation) and
        lost its VERB (authenticate a request). Nothing in any target built
        the mechanism; RF-SEC-001 ("no anonymous action") had no implementer.
        EVERY downstream gate passed, correctly: design-review checks design
        vs ADRs, code-review and QA judge against the task, project-management
        sequences what exists. The general form: every gate checks its
        artifact against its INPUT; NO gate checks the input was completely
        CARRIED FORWARD. The invariant "every design component has a task"
        lived nowhere it could be enforced. Aggravator: the RF-coverage
        postcondition ALREADY EXISTED in task-extraction's contract and did
        not save — a deterministic postcondition in band is self-attestation
        (the same lesson that created `verify` in 1.2.x, one level up), and
        coverage-by-citation can satisfy it while the verb goes unbuilt.
      decision: |
        Coverage is a CHECK CLASS, not a one-off. Shipped in 1.9.0 for the
        sharpest edge: verify (external, run by the caller) warns when an ID
        defined upstream (definition-shaped lines in system-design/frd) is
        cited by ZERO task files — citation, including a declared gap in the
        index's new Coverage section, is visibility; zero citations is a hole
        nobody has looked at. task-extraction gained the component→task
        postcondition and the nouns-are-not-the-verb doctrine (the machine
        checks the citation edge; only extraction can check the verb).
        REMAINING EDGES, same family, not yet wired: prd goals → frd RFs;
        design boundaries → api-contract operations; slos → alerts/runbooks;
        test-plan already has its matrix (RF → case) but nothing external
        re-checks it. Wire them one field case at a time — an invariant added
        without a real miss behind it is a checklist item, and checklists rot.
        THE FOURTH CASE (measured 04/08, field): the check catches
        defined-but-uncited; it is BLIND to defined-cited-badly-extracted.
        The auth component was defined 41× upstream and cited 16× by tasks —
        green — while the verb (authenticate a request) had no task. The
        check is a FLOOR ("did anyone look?"), never a ceiling ("did they
        look right?") — the ok message says so since 1.10.2, the
        task-extraction doctrine names the four cases since 1.11.0. The
        fourth case is the NEXT coverage iteration's spec: where a component
        decomposes into child IDs, "component cited but 4 of 7 children are
        not" is detectable — but it WAITS for a decomposition convention
        (what makes an ID a child of COMP-07?) that the spec does not have;
        a heuristic without the convention fires false, and false positives
        are the house's forbidden currency. Where the component is atomic
        prose, it stays gate judgment, irreducibly.

    # (restored 1.11.0: this header was eaten by the 1.9.0 coverage-invariants
    #  insert — graduated-gate's keys became silent duplicates inside the entry
    #  above. PyYAML swallows duplicate keys, so the validator stayed green;
    #  the runtime's YAML 1.2 parser is what finally refused. The checker that
    #  parses this file now does so with the strict parser, on purpose.)
    - id: graduated-gate
      severity: major
      issue: |
        Every artifact crosses the same gate with the same ceremony: fixing a
        factual line ("3 steps" → "4", with directory evidence) costs the same
        as approving the whole PRD scope. That is uniformity, not rigor — and
        uniform rigor reduces compliance everywhere instead of rigor where it
        matters. Field signal: the gate was bypassed twice with good reason in
        one session. The method HAS the doctrine (decision-reversibility) and
        did not apply it to itself.
      decision: |
        Scale what crosses the gate by blast radius, never who approves (that
        stays human, non-negotiable). Design a CORRECTION edit class: factual,
        evidenced, no semantic change — re-approved by confirmation instead of
        re-review, recorded as such. rebless covers bulk-cosmetic; this covers
        single-artifact minor. Adopted test criterion from the field: a third
        good-reason bypass is DATA about granularity, not operator indiscipline.

        The class is what the MACHINE delimits, never what the author declares
        ("just a correction" is self-serving — the same fork 1.3.0 burned with
        the executor's "additive, non-breaking"). Computable envelope: same
        section count, same RF IDs, requires-graph untouched, AND the diff
        touches no protected field — reuse the task co_writer's may_not_write
        (overview, rules, requirements, success_criteria, task_tests). Diff SIZE
        is the wrong leg: flipping `p95 < 100ms` to `300ms` is one character and
        a semantic change; structural boundaries catch it, a threshold does not.
        Inside the envelope, approve --correction confirms and fires the
        downstream re-pin automatically; outside it, full ceremony.
      pressure_note: |
        Sharpened by the 1.5.0 review, and the reviewer is right on both
        counts. (1) The two questions are separate and only one was ever
        answered: WHO approves is this-or-nothing (human, settled); WHAT
        crosses, in WHICH ceremony, is scalable and still uniform.
        divergence_taxonomy is adjacent, not this: it decides whether a
        divergence justifies an amendment, not what ceremony the amendment
        must cross. (2) Structural irony, on record: everything 1.5.0 did
        makes the tooling MORE honest — truncation fails, prose hashes warn,
        broken promises fail — which means MORE catches arriving at the exact
        bottleneck nobody widened. Honest tooling raises gate pressure; this
        entry is the relief valve, and it is the highest-leverage open item
        for the method surviving a team of twenty. Deliberately NOT rushed
        into 1.5.0: gate granularity deserves rebless-grade design
        (enforcement, not theater), and the doctrine to do it already exists
        in decision-reversibility.

    - id: shared-language
      severity: minor
      issue: |
        No ubiquitous-language artifact. Agents redescribe domain concepts in
        20 words where the project's own jargon uses 1 — verbose docs,
        inconsistent naming, wasted reasoning tokens. (Learned from
        mattpocock/skills' CONTEXT.md; it is DDD's ubiquitous language.)
      decision: |
        A `glossary` artifact with an owner, derivable like rules are
        (extracted from code/docs + asked where underivable), read by every
        agent. Term → meaning → where it lives. Small, high leverage.

    - id: gradual-adoption
      severity: minor
      issue: |
        All-or-nothing install is an adoption barrier next to composable
        single-skill repos. But the governance runtime already works standalone
        (status/approve/verify/rebless over any docs folder, no agents needed).
      decision: |
        Document the "receipts first" entry path: adopt docod.mjs alone, add
        the method when the receipts prove themselves. A README section, not
        new machinery.

    - id: git-approval-flow
      severity: major
      issue: |
        Build-phase testimonial: the method governed the paperwork meticulously
        and was blind to code shipping — a task was built straight on main,
        uncommitted, and nothing mechanical objected (isolation is now a duty +
        cicd rule, but it is honor, not enforcement). Worse edge: approvals are
        written post-review, so under squash-merge the approved frontmatter
        stays in the working tree, detaching the gate's proof from the code it
        certifies.
      decision: |
        Integrate vcs hygiene into artifact governance instead of hanging it as
        an optional norm: candidates are a verify/status check via vcs_diff
        (uncommitted governed artifacts = finding; work on the integration line
        when the rule forbids it = finding) and a documented approve→commit
        convention so the gate's record lands WITH the code under squash.
        Needs design with the same care as rebless: enforcement, not theater.
    - id: scale-down-profile
      severity: major
      issue: |
        Ceremony cost is justified on rigorous projects and crushing for a
        CRUD. The bundle assumes rigor always pays; two independent testimonies
        flag the same edge (with cascade-cost as its sharpest symptom).
      decision: |
        Design a lighter profile (instance-level), not a weaker method: fewer
        mandatory gates by declared project class, dispensables pre-waived with
        the waiver recorded. Needs more N before designing.

    - id: multi-approver
      severity: major
      issue: |
        The human gate is singular (approval: {by, at, content_hash}) — team
        operation has no joint approval. Boundary-crossing work (integration
        tasks touching two targets' owners) can be approved by one side alone.
      decision: |
        Teams phase: approvals[] with per-artifact requirements (count or named
        roles); approved only counts when ALL required approvals match the hash,
        and any edit invalidates all at once (mechanical re-consensus).
        Disagreement is NOT resolved in the approval field: it routes to
        rfc/tradeoffs → ADR with a named decision owner, then fresh approvals.

    - id: action-contract
      severity: major          # was blocker: the agents already declare
      progress: "agent side resolved; workflow side pending"
      issue: "Workflows invoke design_architecture, refine_requirements, generate_impact_report. No agent declares any action — `action` is decorative."
      decision: "Fill in `contract` on each agent per spec/agent.yaml."
      note: |
        Half closed: the 16 written agents declare real actions, and the
        validator checks that every artifact has an owner and the owner confirms.

        The other half belongs to the workflows, and it is worse than it looked:
        the 25 actions they invoke have ZERO intersection with the ones the
        agents declare. It is not a renaming matter — the workflows were written
        against a model that did not exist. They will be rewritten in the
        teams/workflows phase, against the contracts that now exist.

  # ---------------------------------------------------------------------------
  # RESOLVED — they stay on record. A deleted blocker is a blocker that comes back.
  # ---------------------------------------------------------------------------
  resolved:
    - id: skill-enrichment
      was: minor
      issue: |
        mattpocock/skills has techniques ours lack: tdd's SEAMS (test at
        pre-agreed public boundaries) and TAUTOLOGICAL-test anti-pattern;
        diagnosing-bugs' "build a tight feedback loop FIRST" with 10 ordered
        constructions; tracer-bullet framing for vertical slices; a thin
        session HANDOFF (session-only context + pointers, never duplicating
        artifacts).
      resolution: |
        DONE: folded seams + tautological into testing-guidelines and test-plan;
        feedback-loop-first into the bugfix skill; tracer-bullet into
        vertical-slicing; add a thin handoff skill honoring "reference
        artifacts by path, never duplicate".

    - id: plugin-distribution
      was: major
      issue: |
        Distribution was bash-installer-only. mattpocock/skills (186k stars)
        shows the two-philosophy model: copy-and-hack vs subscribe-as-plugin.
      resolution: |
        Shipped as a Claude Code marketplace plugin: .claude-plugin/
        (marketplace.json + plugin.json) with a single /docod:setup-docod
        command that runs the merge-safe installer from CLAUDE_PLUGIN_ROOT —
        the plugin is the subscription, the instance stays the user's, and
        re-running the command is the update flow. Packaging excluded from
        the installed .docod/.
    - id: cascade-cost
      was: major
      issue: |
        Every upstream edit reopens and forces re-sync + re-approval of 5+
        artifacts even when the change is lineage-only (hash + trace, zero
        content). Correct, but expensive — the tester's warning: this can make
        people AVOID touching upstream, the opposite of the method's goal.
      resolution: |
        Needs design, not a quick fix: likely a batched "re-bless" that shows
        the diffs and re-approves fast without becoming a rubber stamp. Do not
        ship an escape hatch that lies.
      done: |
        `docod.mjs rebless --by <who> --reason "..." [--repin-inputs] [--yes]`.
        Designed against the perfect real case: a product rename (voare→voarr)
        touched 361 prose-only points and invalidated 32 approvals + ~110 input
        pins. Anti-rubber-stamp guards: --reason MANDATORY and stored inside
        every re-approval it touches (rebless_reason — audit sees the batch and
        its why); without --yes it prints the PLAN with a per-file diff command;
        input re-pin is opt-in, live-lineage only, single-instance resolution
        only; snapshot/append-only/external inputs never touched. The honest
        limit stands: rebless makes bulk re-blessing cheap and recorded — it
        does not decide whether the change was really cosmetic. That reading
        is, and remains, the human's.
        Day-one refinement (found by the voarr rebless itself): repin
        eligibility is cardinality of RESOLUTION, not of type — an input whose
        key names exactly one existing file among many candidates (adr,
        tradeoffs) is an identified source and repins; keyless among many
        still refuses. Refusing an identified source is not honesty, it is a
        coarse guard.
        Third sub-edge (same week): slash-keys are written without extension
        (standards/pista/coding-standards vs coding-standards.md) — resolver
        now normalizes both sides (extension off, path relative) and matches
        path-first, basename after. Basename keys and slash keys both 100%.

    - id: bundle-migration
      was: major
      issue: |
        Bundle updates that change an artifact's path or format mid-flight
        leave the installed project in a fragmented state to reconcile by hand
        (the ADR ledger episode: rich ledger vs inquiry log). Migration of
        user-side state is not first-class.
      resolution: |
        install.sh gains a versioned migrations step: detect old layouts and
        convert them losslessly (or print the exact manual recipe and refuse to
        guess). While migration is manual, transition states bite.
      done: |
        install.sh step 2b: detection-based migrations — no state file, the
        detection IS the state (house law: derived, never maintained). Policy:
        move only when the destination does not exist; old+new both present, or
        judgment-required shapes (the rich ADR ledger), print the exact manual
        recipe and continue — never guess, never destroy. Ships with M1 (stage
        folders → docsRoot by nature), M2 (root workstreams.yaml), M3 (root
        decisions logs) and M4 (ADR ledger recipe). New bundle changes that
        move user state MUST land with their migration in the same commit.

    - id: legacy-absorption
      was: major
      issue: |
        The market is drowning in AI tech debt. reverse_* rebuilds the live
        baseline from code, but legacy systems also HAVE old docs (parent PRD,
        per-epic prd/techspec/tasks). Today nothing makes the reverse agents
        triangulate old docs vs current code and surface divergences ("the doc
        says X, the code does Y") as first-class findings.
      resolution: |
        Make legacy absorption a flagship flow: reverse_* actions take legacy
        docs as a mandatory triangulation source (cited via external
        provenance), every reversed artifact gains a structured Divergences
        section (doc vs code, with evidence), and a coordinated reverse
        sequence lands in the teams phase. Output is LIVE documentation, never
        imported snapshots. Pilot on the current legacy test before promoting
        it to README/landing as its own use case.
      pilot_result: |
        Pilot ran (2026-07, "The Blue City" admin, via Kimi K3 on AGENTS.md):
        it works. 3 reversed designs with 40 structured DIV-nn divergences,
        cross-corroborated (the gravest found independently by two reverses),
        a privacy finding classified as RISK not neutral gap, stale detection
        of the legacy docs AND of our own doc (asked before fixing), and a
        ghost premise buried on record so nobody "fixes" what does not exist.
        Formalize what the pilot improvised: the DIV-nn section shape, the
        "only staging/backend can answer" question class, and git-history
        citations as external provenance.
      residual: |
        The coordinated reverse SEQUENCE (which reverse runs first, what feeds
        what) stays in the teams phase, alongside action-contract. What is now
        contract: 3 postconditions on every reverse_* action (+ extract_from_code)
        and the canonical reverse_conventions block in spec/agent.yaml.

    - id: declared-inputs-coverage
      was: minor
      issue: |
        The graph is only as good as what artifacts declare: tasks did not
        declare the new ADRs in inputs[], so impact-analysis had to read bodies
        and judge (honestly labeled, but not machine-checked). Where the
        artifact does not declare, verify cannot see.
      resolution: |
        DONE: task-extraction gained a deterministic postcondition (cited ADRs/designs declared in inputs[] with computed hash) and verify gained a warn: body cites ADR-nnnn absent from inputs[] — "undeclared link, invisible to staleness". Warn, not fail: the heuristic is textual. Original sketch: declare consumed ADRs/designs in
        inputs[] as a postcondition; consider a verify warn when a task's body
        cites an ADR id absent from its inputs.

    - id: rules-before-build
      was: major
      issue: |
        Chicken-and-egg found in the build phase of the first real project:
        task-extraction and the executors ran with docs/standards/ absent —
        nothing in the contracts required rules to exist, so code-review had
        no norm and the absence passed in silence. Review without a ruler is
        self-attestation with taste as the standard. Bonus bug: the per-target
        rules path used a {target} placeholder the resolver did not know, so
        per-target rules were invisible to status/report/verify.
      resolution: |
        (1) task-executor.execute_task and code-review.review_code now REQUIRE
        coding-standards in [approved, draft] — waivable, so a small project
        can consciously skip, but the gate names the absence and the waiver is
        recorded. (2) resolvePaths learned {target} = the target's key, one
        pattern per target. Per-target rules resolve everywhere now.
    - id: lineage-classes
      was: major
      issue: |
        verify treated every input as a LIVE dependency. First full sweep on a
        real project: impact/0001 (a record of a propagation) failed on the 5
        inputs it had itself made obsolete; the PRD failed on its append-only
        decisions sidecar and on the imported .docx provenance. Refreshing any
        of them would lie about what was analyzed.
      resolution: |
        Three lineage classes, declared in the registry and honored by verify:
        `lineage: snapshot` on record artifacts (reviews, impact, postmortem,
        adr, qa, codereview, evidencias, release-notes, counsel) — inputs are
        observed-at, reported, never failed; inputs pointing at `append_only`
        artifacts (decisions) — observed state, not live-checked; and
        `external: true` on an input entry — provenance outside the registry.
        Unregistered inputs WITHOUT external remain failures (typo catch).
    - id: self-attestation
      was: major
      issue: |
        "deterministic" postconditions enforced in band degenerated into
        self-attestation (subagent verifying its own work) and DIVERGED in the
        first real test: wrong hash cited, wrong counts.
      resolution: |
        `docod.mjs verify <file>`: the CALLER runs external verification of the
        computable class — frontmatter parses, status enum, approval hash vs
        content, every inputs[].hash vs the current source artifacts, artifact
        registered. Wired into /docod:run (step 5) and the subagent envelope.
        Judgment/evidence classes remain reviewer-gated — honest, not computable.
    - id: junk-subagent
      was: major
      issue: |
        A subagent returned junk (echoed instructions, tool_uses: 0) and the
        harness surfaced it as if it were a result.
      resolution: |
        /docod:run rule: a reply with neither a written artifact nor
        `QUESTIONS FOR THE USER:` is a FAILED run — declared and reinvoked,
        never presented as a result.
    - id: seq-race
      was: minor
      issue: "Two parallel adr runs both took {seq} 0002 — allocation is not atomic."
      resolution: |
        Claim-by-creation rule in adr.md: create the empty file FIRST (file
        creation is the allocation), then write. Parallel runs on the same
        numbered artifact documented as best avoided in v1.
    - id: yaml-by-grep
      was: minor
      issue: "With no parser available, agents claimed 'valid YAML' verified only by grep."
      resolution: "`docod.mjs verify` parses YAML/frontmatter with the vendored parser — zero install."
    - id: runtime-node
      was: minor
      issue: |
        The command runtime (docod.py) required python3+pyyaml, which not every
        machine has — and "install pip before using the method" contradicts a
        bundle that calls itself zero-dependency.
      resolution: |
        Ported to docod.mjs: pure node (>=18) with js-yaml VENDORED in
        vendor/ (MIT) — zero python, zero pip, zero npm install. Own glob
        (fs.globSync only exists in node 22) and YAML 1.2 CORE schema pinned,
        otherwise js-yaml converts dates into Date and the reserialization
        would mutate the user's file. Port validated by diff: output identical
        to docod.py's across the 6 smoke-test scenarios, byte for byte on
        status. docod.py deleted — there is one reference implementation, not
        two.
    - id: agent-format
      was: major
      issue: "The 30 agents were in the phidata/agno schema, made for an external runtime — config.model, config.tools, config.memory."
      resolution: |
        27/27 rewritten in markdown + contract, all passing the validator.
        The count changed along the way, and every change is on record:
          DIED (6): deprecation (no need for it) · diagrams and
            requirements-specialist (became skills) · trd (became a team) ·
            coding-standards, testing-guidelines, cicd-guidelines (became rules)
          SPLIT (1): security-design → security-rules (rule) + security-design (agent)
          BORN (4): api-contract (from the trd) · task-executor and qa-executor
            (from the execute_* prompts) · rules-factory
        + 12 neutral skills + 4 rule templates + 344 postconditions classified
        by nature (deterministic 34% · evidence 22% · judgment 44%).
    - id: gate-ownership
      was: blocker
      issue: |
        Eleven agents wrote `status: draft`, one wrote `approved`, and nobody
        promoted prd/frd/tasks/code — every `status: [approved]` precondition
        was unsatisfiable. The status machine existed on paper and blocked
        nothing.
      resolution: |
        Closed in three pieces, all in v1:

        1. AGENT GATES already covered design (design-review), behavior
           (qa-executor) and diff (code-review) — verdict in the reviewer's
           artifact, the owner moves their own status.
        2. HUMAN GATE for requirement and plan (prd, frd, user-stories, tasks,
           test-plan, roadmap): the `approve` command writes
           `approval: {by, at, content_hash}` into the frontmatter. See
           method.yaml § approval and spec/commands.yaml.
        3. MECHANICAL VALIDITY: approved only holds while the hash matches.
           Edited after approval → it invalidates by itself, and `status` shows
           it. Tested: the frd unblocked with the prd approved and RE-BLOCKED
           when the prd was edited — without anyone having to remember anything.

        Reference implementation: docod.mjs (status, start, continue,
        approve, ws). Full smoke test on a fake project: 6 scenarios, including
        an invalidated approval and an abandon without a reason being refused.
    - id: tool-lockin
      was: blocker
      issue: "Method prompts demand a concrete tool ('USE THE CONTEXT 7 SKILL', 'Use the Playwright MCP') and point at @.claude/rules."
      root_cause: "layer 3 written inside layer 2"
      resolution: |
        The entire lock-in lived in FOUR files — execute_task, execute_qa,
        execute_review, execute_bugfix — and was not scattered as assumed.
        The four were absorbed by the agents; no tool string entered the
        bundle. What used to be a name became a capability:

          Context7 MCP            → doc_lookup
          Playwright MCP          → browser_e2e, a11y_audit
          @.claude/rules, /skills → coding-standards, testing-guidelines
          bun run test, npm test  → shell
          @task-reviewer          → code-review (which now actually exists)

        The adapter resolves each capability. Switching harness does not touch
        the bundle.

        Kept from what the prompts taught, because it is not about tooling:
        execute_task repeated "mark it complete in tasks.md" NINE times.
        Repetition in a prompt is not emphasis — it is design debt screaming.
        Whoever wrote it knew the agent was not doing it and kept turning up
        the volume.

    - id: knowledge-roles
      was: major
      issue: "77 knowledge sources, 4 implicit roles, 30+ free-form names. question_bank vs questions_bank vs questions_userstories are the same role."
      root_cause: "Reference without a rule and without a validator — fourth occurrence of the same failure in this project."
      resolution: |
        `knowledge` dissolved along with the format: the agent body is markdown
        and the role became a SECTION — `## structure`, `## inquiry`, `## style`.
        Free-form naming is over; there are four, enumerated.

        And now validated. Enumerating without validating would repeat the
        failure with new syntax — which is exactly how it came back the other
        five times. `validate-layers.py` rejects a role outside the list, an
        agent without `## structure`, and `interactive: true` without
        `## inquiry`.

    - id: artifacts-registry
      was: major
      issue: "spec/artifacts.yaml does not exist: missing the registry of which document each agent delivers, in which scope, at which path."
      resolution: "34 artifacts registered. Every artifact has an owner, and the validator checks that the owner confirms ownership — in both directions."

    - id: skills-map
      was: major
      issue: "spec/method.yaml has `skills: {}` empty on purpose."
      resolution: |
        12 neutral skills, registered, with `used_by` validated against what the
        agents declare — in both directions. It was not deduction: each one was
        born from a concrete agent that needed it, and survived the test "does
        more than one agent need this procedure?".

        Two became skills for having failed as agents: `requirements-elicitation`
        (was requirements-specialist) and `diagram-as-code` (was diagrams). Both
        delivered a craft, not a document.

