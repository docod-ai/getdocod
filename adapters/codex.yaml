specVersion: "1.14.0"

# =============================================================================
# LAYER 3 — ADAPTER: CODEX · PLUGGABLE
#
# Codex reads AGENTS.md, repository skills under .agents/skills/, and
# project-scoped custom agents under .codex/agents/. The stable DOCOD public
# namespace remains /docod:*: the `docod` plugin exposes it natively and the
# AGENTS.md router recognizes the same literal requests in repository installs.
# =============================================================================

adapter:
  key: codex
  name: "Codex"
  vendor: openai
  default: false

capabilities:
  code_edit:   { tool: "apply_patch" }
  shell:       { tool: "local shell" }
  vcs_diff:    { tool: "local shell", cmd: "git diff" }
  vcs_history: { tool: "local shell", cmd: "git log" }
  code_search: { tool: "local shell", cmd: "rg", degraded_to: "grep" }
  web_search:  { tool: "web search", runtime_defined: true,
                 note: "availability depends on the Codex surface and workspace policy" }
  web_fetch:   { tool: "web open", runtime_defined: true,
                 note: "availability depends on the Codex surface and workspace policy" }
  doc_lookup:  { tool: null, runtime_defined: true, degraded_to: web_search,
                 note: "use an enabled documentation MCP/skill when present; otherwise search official docs" }
  browser_e2e: { tool: null, runtime_defined: true, degraded_to: null,
                 note: "requires an installed browser plugin/MCP; otherwise record NOT VERIFIED" }
  a11y_audit:  { tool: null, runtime_defined: true, degraded_to: null,
                 note: "requires browser accessibility tooling; otherwise record NOT VERIFIED" }
  calculator:  { tool: "local shell", cmd: "node -e" }
  ask_user:    { tool: "main-session user input", runtime_defined: true,
                 note: "subagents hand back QUESTIONS FOR THE USER to the parent session" }

promote:
  index:
    path: "AGENTS.md"
    mode: generate
    note: "Codex loads project instructions from AGENTS.md before work begins"
  rules:
    - { artifact: coding-standards,   to: ".agents/rules/code-standards.md" }
    - { artifact: testing-guidelines, to: ".agents/rules/tests.md" }
    - { artifact: security-rules,     to: ".agents/rules/security.md" }
    - { artifact: system-design,      to: ".agents/rules/architecture.md" }
    - { artifact: cicd-guidelines,    to: ".agents/rules/cicd.md" }

invoke:
  mode: subagent
  agentsRoot: ".codex/agents/"
  skillsRoot: ".agents/skills/"
  command_contracts: ".docod/adapter-assets/codex/commands/"
  commands:
    namespace: "/docod:"
    native: "skills in the installable docod Codex plugin"
    repository_fallback: "AGENTS.md literal namespace + docod-commands router skill"
  materialization: |
    One project-scoped TOML custom agent per DOCOD producer, generated as a
    thin envelope that reads .docod/agents/<key>.md in full. The tech-lead
    custom agent is restricted to consolidate_diagnostic; /docod:lead remains
    a main-session conversation.

    The public command names do not change between harnesses. The Codex plugin
    is named `docod` and its command skills are named start, status, continue,
    approve, ws, run, report, lead, loop, and diagnose, preserving
    /docod:<command>. A repository install also writes an AGENTS.md rule and a
    docod-commands router skill so literal /docod:* requests resolve to the
    same command contracts even without plugin UI discovery.

    Every generated file carries `generated-by: docod`. A namesake without
    the marker is user-owned and is warned-and-skipped, never overwritten.

enforcement:
  deterministic:
    mechanism: in-band-plus-external-verify
    contract: |
      The producing custom agent runs the declared computable checks and shows
      command plus output. The parent command session independently runs
      `node .docod/docod.mjs verify <artifact>` before accepting delivery.
  evidence:
    mechanism: in-band
    contract: |
      Evidence is command output and file:line content, not an agent's claim.
      A missing optional tool degrades to NOT VERIFIED and remains visible.
  judgment:
    mechanism: none
    contract: |
      Judgment remains a separate agent gate and, ultimately, a human act.

# -----------------------------------------------------------------------------
# COERCION — the regulated profile (optional; cooperation is the method)
# Six shared points (see adapters/claude-code.yaml for the doctrine): the
# method owns the POINTS, the deployment owns the mechanisms. This adapter
# follows its own honesty vocabulary: `runtime_defined: true` where the
# mechanism depends on the Codex surface and workspace policy, never a
# config key this file cannot vouch for. The vendor-neutral floor for every
# point is the VCS and CI: branch protection, required review, and the
# runtime's exit codes (verify, observe, the validator) as required checks.
# -----------------------------------------------------------------------------
coercion:
  points:
    approval_gate:
      need: "only a human writes `approved`; agents deliver draft/review"
      mechanism: null
      runtime_defined: true
      floor: "branch protection + CODEOWNERS on {docsRoot}: an approval edit reaches the trunk only through a human-reviewed PR"
    hook_integrity:
      need: "the gates' checks cannot be disabled locally"
      mechanism: null
      runtime_defined: true
      floor: "CI re-runs verify and the validators server-side; a locally skipped check fails the required status anyway"
    supply_chain:
      need: "skills, plugins and tools come from an approved source only"
      mechanism: "workspace policy governs which tools and skills a surface enables"
      runtime_defined: true
      floor: "harness config under version control and review; drift caught by diff, not prevented"
    sandbox_egress:
      need: "network allowlist and credential isolation BELOW the tool layer"
      mechanism: "the surface's sandbox and approval modes, where the deployment pins them by policy"
      runtime_defined: true
      floor: "none below the OS. Declared: without a pinned sandbox this point is cooperation only"
    merge_gate:
      need: "nothing integrates without verify and the owed reviews"
      mechanism: "branch protection with required checks running `node .docod/docod.mjs verify` on governed artifacts"
      floor: "this point IS the vendor-neutral floor"
    config_regression:
      need: "agent-configuration changes run the evals suite (artifacts.yaml § evals, 1.17.0)"
      mechanism: "a CI job on any change to AGENTS.md, .agents/ skills or {docsRoot}standards/: run the suite non-interactively and gate on the qa-executor's recorded pass rate"
      floor: "CI is the floor"
  note: |
    runtime_defined here means exactly what it means in capabilities: the
    mechanism exists at the discretion of the surface and the workspace
    policy, and this file DETECTS rather than presumes. Pointing at a config
    key this adapter cannot verify would be failure #1 (a reference with
    nobody on the other end) inside the adapter itself.

conformance:
  supports_all_capabilities: conditional
  degraded: [doc_lookup]
  unavailable_without_external_tooling: [browser_e2e, a11y_audit]
  enforcement:
    deterministic: "producer evidence plus parent-run external verify"
    evidence: "full when capability exists; explicit NOT VERIFIED otherwise"
    judgment: "n/a by definition"
  interactive: "main-session questions; custom agents use the hand-back protocol"

